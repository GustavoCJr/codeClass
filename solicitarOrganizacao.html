<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Informações sobre o cadastro institucional no CodeClass." />
    <title>CodeClass | Cadastro institucional</title>
    <link rel="icon" href="/landing/favicon.png" type="image/png" />
    <style>
      :root { color-scheme: light; font-family: Inter, Segoe UI, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #080808; color: #fff; padding: 24px; }
      main { width: min(100%, 600px); border: 1px solid #343434; background: #121212; padding: clamp(28px, 5vw, 50px); }
      .brand { color: #00bf63; font-weight: 800; font-size: 24px; text-decoration: none; }
      h1 { margin: 38px 0 16px; font-size: clamp(32px, 5vw, 48px); line-height: 1.05; letter-spacing: -1.5px; }
      p { color: #c4c4c4; font-size: 16px; line-height: 1.65; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
      .btn { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 18px; font-size: 13px; font-weight: 800; text-decoration: none; }
      .btn-primary { background: #00bf63; color: #080808; }
      .btn-secondary { color: #fff; border: 1px solid #666; }
      a:focus-visible { outline: 3px solid #00bf63; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Voltar ao início do CodeClass">&lt; CodeClass /&gt;</a>
      <h1>Cadastro institucional em preparação.</h1>
      <p>Estamos definindo como novas instituições terão acesso ao CodeClass. O cadastro ainda não foi liberado nesta página.</p>
      <p>Se você já possui uma conta, pode acessar normalmente a plataforma.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/login.html">ENTRAR NA PLATAFORMA</a>
        <a class="btn btn-secondary" href="/">VOLTAR AO INÍCIO</a>
      </div>
    </main>
  </body>
</html>
